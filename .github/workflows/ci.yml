name: CI

on:
  push:
    paths: ['Formula/**', 'scripts/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['Formula/**', 'scripts/**', 'tests/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  formulae:
    uses: ./.github/workflows/validate-formula.yml
